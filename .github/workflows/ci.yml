name: CI

# Build/test/scan only — no publish/push-image step (per project convention;
# see docs/00-research-and-architecture-review.md §9/§91 on CI-time
# dependency/secret scanning).

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only required for private repos on gitleaks' own licensing terms;
          # harmless/no-op if unset (e.g. on a public repo).
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend (dev extras)
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: ruff check
        working-directory: backend
        run: ruff check .

  backend-test:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The test suite (from Phase 3 onward) exercises real ffmpeg/ffprobe
      # against small generated fixture streams rather than mocking the
      # media pipeline — ubuntu-latest images typically bundle ffmpeg
      # already, but installing it explicitly makes that a guarantee, not
      # an assumption about the runner image's current contents.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install backend (dev extras)
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: pytest
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm install

      # Frontend linting is best-effort: this repo does not currently ship
      # an ESLint config, so that step is skipped gracefully rather than
      # failing the build. tsc's project config is present, so the
      # type-check step runs whenever tsconfig.json exists.
      - name: Check for ESLint config
        id: eslint_check
        working-directory: frontend
        run: |
          if ls .eslintrc* eslint.config.* >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ESLint config found under frontend/ — skipping lint step."
          fi
      - name: ESLint
        if: steps.eslint_check.outputs.found == 'true'
        working-directory: frontend
        run: npx eslint .

      - name: Check for TypeScript config
        id: tsc_check
        working-directory: frontend
        run: |
          if [ -f tsconfig.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No tsconfig.json found under frontend/ — skipping type-check step."
          fi
      - name: Type-check (tsc)
        if: steps.tsc_check.outputs.found == 'true'
        working-directory: frontend
        run: npm run lint --if-present

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: groovarr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
