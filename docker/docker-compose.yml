# Groovarr — single-container Compose stack.
#
# Per docs/00-research-and-architecture-review.md §4/§5: one process, one
# container (no Redis/queue/worker sidecars). Volumes match the three
# documented bind-mount roles: /config (SQLite DB + settings), /music-videos
# (final library), /downloads (working area).
#
# Usage: from this `docker/` directory, `cp ../.env.example .env` (see the
# backend's documented required settings, e.g. GROOVARR_SECRET_KEY) and
# `docker compose up -d --build`. Run from *this* directory (rather than
# `docker compose -f docker/docker-compose.yml up` from the repo root) so
# Compose's project directory — where it looks for `.env` — is `docker/`,
# matching where you just created it.

services:
  groovarr:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PORT: ${PORT:-8080}
    image: groovarr:latest
    container_name: groovarr
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - ./config:/config
      - ./music-videos:/music-videos
      - ./downloads:/downloads
    env_file:
      - .env
    environment:
      # Mirrors the port mapping above; overridden by .env if set there too.
      PORT: ${PORT:-8080}
    # --- Optional: hardware-accelerated transcoding -------------------------
    # Groovarr auto-detects usable hardware video encoders at startup (see
    # Settings → Media Management → Hardware Acceleration and GET
    # /api/system/hardware-acceleration) and safely falls back to software
    # if none are reachable — nothing below is required for Groovarr to
    # work. Uncomment ONE of the two blocks that matches your host's GPU to
    # let the container actually reach it; live-verified against a real
    # Intel iGPU on 2026-09-14 (a genuine VAAPI encode completed in well
    # under a second, versus several minutes of CPU-bound software encoding
    # for the same clip).
    #
    # Intel Quick Sync (QSV) or generic VAAPI (Intel or AMD iGPU/dGPU) —
    # passes through the host's DRM render node. Enabled here: this
    # deployment's host has a real Intel iGPU (confirmed above).
    devices:
      - /dev/dri:/dev/dri
    #
    # NVIDIA (NVENC) — requires the NVIDIA Container Toolkit installed on
    # the host (see docs.nvidia.com/datacenter/cloud-native/container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('PORT','8080') + '/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
